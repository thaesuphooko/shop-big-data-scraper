name: Mega Auto Scraper 2026

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Node 24 ဖြင့် အလုပ်လုပ်စေရန် Force Variable တစ်ခု သတ်မှတ်ပေးခြင်း
    - name: Set Node Version Env
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

    # လိုအပ်သော Packages များအား သေချာစွာ ထည့်သွင်းခြင်း
    - name: Install dependencies & Playwright Browser
      run: |
        pip install playwright beautifulsoup4 pandas
        playwright install chromium

    - name: Run Scraper Bot
      run: python mega_scraper.py

    - name: Commit and Push Big Data
      run: |
        git config --global user.name "Mega Data Bot"
        git config --global user.email "databot@github.com"
        git add data/*
        git commit -m "Scraped All Categories Safely via Stealth Playwright" || exit 0
        git push
