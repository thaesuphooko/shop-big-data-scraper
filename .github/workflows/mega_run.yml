name: Mega Auto Scraper 2026

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # အိတ် (Folder) မရှိသေးရင် အလိုအလျောက် အရင်ဆောက်ခိုင်းသည့်စနစ်
    - name: Create Data Folder Safely
      run: mkdir -p data

    # ဒေတာထုတ်လုပ်မည့် စက်ရုပ်ကို မောင်းနှင်ခြင်း
    - name: Run Scraper Bot
      run: python mega_scraper.py

    # ဖိုင်တွဲအသစ်ကို GitHub ပေါ်သို့ သေချာပေါက် အောင်မြင်စွာ တင်ခြင်း
    - name: Commit and Push Big Data
      run: |
        git config --global user.name "Mega Data Bot"
        git config --global user.email "databot@github.com"
        git add data/ || true
        git commit -m "Generated Static Products Data Safely" || exit 0
        git push
