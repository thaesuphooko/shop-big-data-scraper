name: Mega Auto Scraper 2026

on:
  schedule:
    - cron: '0 17 * * *' # မြန်မာစံတော်ချိန် နေ့တိုင်း ည ၁၁ နာရီခွဲတွင် Auto Run မည်
  workflow_dispatch: # ကိုယ်တိုင်နှိပ်ပြီး Run ချင်လျှင်လည်း ရသည်

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Node 24 ဗားရှင်း သတိပေးချက်ကို လုံးဝကျော်လွှားရန် Force သတ်မှတ်ခြင်း
    - name: Set Node Version Env
      run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

    # CRITICAL FIX: Playwright မောင်းနှင်ရန် လိုအပ်သော Linux Libraries များနှင့် Dependencies အားလုံးကို ထည့်သွင်းခြင်း
    - name: Install dependencies & Playwright Browsers with Linux Deps
      run: |
        pip install playwright beautifulsoup4 pandas
        playwright install chromium
        playwright install-deps chromium

    - name: Run Scraper Bot
      run: python mega_scraper.py

    - name: Commit and Push Big Data
      run: |
        git config --global user.name "Mega Data Bot"
        git config --global user.email "databot@github.com"
        git add data/*
        git commit -m "Scraped All Categories Safely via Stealth Playwright" || exit 0
        git push
